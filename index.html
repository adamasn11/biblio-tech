<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech - Gestion de Bibliothèque</title>
    
    <meta name="description" content="Application de gestion de bibliothèque professionnelle">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        secondary: '#4f46e5',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased h-screen overflow-hidden flex transition-colors duration-300">

    <aside id="sidebar" class="bg-white w-64 h-full hidden md:flex flex-col border-r border-gray-200 transition-all duration-300 dark:bg-gray-900 dark:border-gray-700 z-20">
        
        <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-gray-800">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-book-open-reader text-2xl text-primary-600"></i>
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-secondary">BiblioTech</span>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        </nav>

        <div class="p-4 border-t border-gray-200 dark:border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center text-primary-600 font-bold" id="user-avatar">AD</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate dark:text-white" id="user-name">Admin User</p>
                    <p class="text-xs text-gray-500 truncate dark:text-gray-400" id="user-role">Administrator</p>
                </div>
                <button id="logout-btn" class="text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>
    
    <div class="flex-1 flex flex-col h-full relative">
        
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-6 z-10 dark:bg-gray-900/80 dark:border-gray-800">
            
            <button id="sidebar-toggle" class="md:hidden text-gray-500 hover:text-primary-600">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <h1 id="page-title" class="text-xl font-semibold text-gray-800 dark:text-white hidden md:block">Dashboard</h1>
            
            <div class="flex items-center gap-4">

                <div class="relative group">
                    <button class="flex items-center gap-2 text-sm text-gray-600 hover:text-primary-600 dark:text-gray-300">
                        <i class="fa-solid fa-globe"></i>
                        <span id="current-lang">FR</span>
                    </button>
                    <div class="absolute right-0 top-full mt-2 w-32 bg-white rounded-lg shadow-lg border border-gray-100 py-1 hidden group-hover:block dark:bg-gray-800 dark:border-gray-700">
                        <button onclick="app.setLanguage('fr')" class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700">Français</button>
                        <button onclick="app.setLanguage('en')" class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700">English</button>
                        <button onclick="app.setLanguage('ar')" class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700">العربية</button>
                    </div>
                </div>
                
                <button id="theme-toggle" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 transition-colors">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <main id="app-content" class="flex-1 overflow-x-hidden overflow-y-auto p-6 bg-gray-50 dark:bg-gray-900">
            <div id="loading" class="hidden h-full flex items-center justify-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
            </div>
        </main>

    </div>
    
    <div id="auth-overlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center hidden">
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
